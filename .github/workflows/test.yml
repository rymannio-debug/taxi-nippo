# 自動テストと公開
#   dev に入れる → 組み立ての確認 → テスト（Chromium と WebKit、それぞれ4つに分けて同時に）→ 全部通ったら試し版（…/test/）に出す
#   試し版で確かめたら、手動で「promote」を付けて動かす → 本番（main の上）に出す。test/ の試し版は残る
#   main に直接入れたときや、プルリクエストのときは、テストだけ走らせる
name: テストと公開
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      promote:
        description: 試し版で確かめた dev を本番（main）に出す
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    name: 組み立ての確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # マニュアルのページ（manual/*.html）を作るのに使う。版を固定して、作るたびに同じものになるように
      - run: pip install markdown==3.11
      - run: python3 tools/build.py --check
  test:
    name: テスト（${{ matrix.browser }} ${{ matrix.shard }}/4）
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: 日本語のフォント（手元と同じ Noto CJK）
        run: sudo apt-get install -y fonts-noto-cjk
      - run: node tests/run.js
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}/4
          TZ: Asia/Tokyo
  stage:
    name: 試し版に出す（…/test/）
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: dev の組み立てたものを main の test/ に置く（本番はそのまま）
        run: |
          python3 src/tools/stage.py src site/test
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A test
          git diff --cached --quiet || git commit -qm "試し版: $(grep -o "APP_VER='v[0-9]*'" ../src/src/app.html)（dev ${GITHUB_SHA::7}）"
          git push origin HEAD:main
      - name: GitHub Pages の公開を頼む
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages の公開は自動で始まります"
  promote:
    name: 本番に出す（試し版と同じ dev を main へ）
    if: github.event_name == 'workflow_dispatch' && inputs.promote && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: main の中身を dev と同じにする（test/ の試し版は残す）
        run: |
          cd site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name test -exec rm -rf {} +
          (cd ../src && git archive HEAD) | tar -x
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "本番: $(grep -o "APP_VER='v[0-9]*'" src/app.html)（dev ${GITHUB_SHA::7}）"
          git push origin HEAD:main
      - name: GitHub Pages の公開を頼む
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages の公開は自動で始まります"
